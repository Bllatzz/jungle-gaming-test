services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    # 5434 no host: 5432/5433 costumam estar ocupadas por um Postgres local.
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "wagering", "-d", "wagering"] # TCP: o socket unix responde já no servidor temporário do initdb
      interval: 2s
      timeout: 3s
      retries: 20

  localstack:
    # Fixada: desde a 2026.03.0 a imagem latest exige LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:4.12
    environment:
      SERVICES: sqs
    ports: ["127.0.0.1:4566:4566"]
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      test: ["CMD", "awslocal", "sqs", "get-queue-url", "--queue-name", "wallet-events.fifo"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Roda as migrations uma vez, antes dos apps: N réplicas não disputam o schema.
  migrate:
    image: wagering-processor # mesma imagem do app (um build só)
    build: .
    command: ["bun", "run", "migration:up"]
    environment: &app-env
      PORT: "3000"
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_WAGER_QUEUE: wager-transactions.fifo
      SQS_WAGER_DLQ: wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE: wallet-events.fifo
      # Vazias = auth desligada. Com o Keycloak (perfil auth), ver README → Autenticação.
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      # Vazia = tracing desligado. Com o perfil observability: http://jaeger:4318
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    image: wagering-processor
    build: .
    environment: *app-env
    # Faixa de portas para `docker compose up --scale app=3` (3000, 3001, 3002).
    ports: ["127.0.0.1:3000-3002:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      localstack: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Opcionais (diferenciais): sobem só com o perfil pedido ---

  # IdP externo: `docker compose --profile auth up -d keycloak`. Um client OIDC por provedor de jogos.
  keycloak:
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Emissor fixo: token pedido no host (localhost:8180) vale para o app dentro do compose também.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080"] # 8080 no host costuma estar ocupada
    volumes:
      - ./docker/keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    healthcheck:
      # a imagem não tem curl: HTTP na mão pela porta de gerenciamento
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Métricas + dashboard: `docker compose --profile observability up -d`. Grafana em http://localhost:3003.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.1.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]

  # Traces (OpenTelemetry, OTLP/HTTP na 4318). UI em http://localhost:16686
  jaeger:
    profiles: [observability]
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.4.0
    environment:
      # só para dev local: entra direto, sem login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/wagering.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3003:3000"]
    depends_on: [prometheus]
